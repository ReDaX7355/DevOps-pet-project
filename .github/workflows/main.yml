name: Main Build (RC)

on:
  push:
    branches:
      - main  # ветка для деплоя

jobs:
  build-rc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set SHA
        id: vars
        run: echo "SHA=$(git rev-parse --short HEAD)" >> GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/backend:rc-${{steps.vars.outputs.SHA}} \
            -t ghcr.io/${{ github.repository_owner }}/backend:latest \
            ./backend
            docker push ghcr.io/${{ github.repository_owner }}/backend:rc-${{steps.vars.outputs.SHA}}
            docker push ghcr.io/${{ github.repository_owner }}/backend:latest

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/frontend:rc-${{steps.vars.outputs.SHA}} \
            -t ghcr.io/${{ github.repository_owner }}/frontend:latest \
            ./frontend
            docker push ghcr.io/${{ github.repository_owner }}/frontend:rc-${{steps.vars.outputs.SHA}}
            docker push ghcr.io/${{ github.repository_owner }}/frontend:latest

