name: Main Build (RC)

on:
  push:
    branches:
      - main  # ветка для деплоя

jobs:
  build-rc:
    runs-on: ubuntu-latest

    permissions:
      contents: read    # обязательно для checkout
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set SHA
        id: vars
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          OWNER_LC=$( echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$OWNER_LC/backend:rc-${{steps.vars.outputs.SHA}} \
            -t ghcr.io/$OWNER_LC/backend:latest \
            ./backend
            docker push ghcr.io/$OWNER_LC/backend:rc-${{steps.vars.outputs.SHA}}
            docker push ghcr.io/$OWNER_LC/backend:latest

      - name: Build frontend
        run: |
          OWNER_LC=$( echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$OWNER_LC/frontend:rc-${{steps.vars.outputs.SHA}} \
            -t ghcr.io/$OWNER_LC/frontend:latest \
            ./frontend
            docker push ghcr.io/$OWNER_LC/frontend:rc-${{steps.vars.outputs.SHA}}
            docker push ghcr.io/$OWNER_LC/frontend:latest

