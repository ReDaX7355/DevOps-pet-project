name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # ветка для деплоя

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/backend:latest ./backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/frontend:latest ./frontend

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/backend:latest

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/frontend:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            PROJECT_DIR=/home/${{ secrets.SERVER_USER }}/DevOps-pet-project

            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository_owner }}/DevOps-pet-project.git .
            else
              git reset --hard
              git pull
            fi

            docker compose pull
            docker compose up -d --remove-orphans

