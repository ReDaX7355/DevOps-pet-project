name: Release and Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner
        id: owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Retag backend
        run: |
          docker pull ghcr.io/${{ steps.owner.outputs.OWNER }}/backend:latest
          docker tag ghcr.io/${{ steps.owner.outputs.OWNER }}/backend:latest \
            ghcr.io/${{ steps.owner.outputs.OWNER }}/backend:${{ steps.vars.outputs.VERSION }}
          docker push ghcr.io/${{ steps.owner.outputs.OWNER }}/backend:${{ steps.vars.outputs.VERSION }}

      - name: Retag frontend
        run: |
          docker pull ghcr.io/${{ steps.owner.outputs.OWNER }}/frontend:latest
          docker tag ghcr.io/${{ steps.owner.outputs.OWNER }}/frontend:latest \
            ghcr.io/${{ steps.owner.outputs.OWNER }}/frontend:${{ steps.vars.outputs.VERSION }}
          docker push ghcr.io/${{ steps.owner.outputs.OWNER }}/frontend:${{ steps.vars.outputs.VERSION }}

      - name: Deploy
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            export VERSION
            cd /home/${{ secrets.SERVER_USER }}/DevOps-pet-project
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
