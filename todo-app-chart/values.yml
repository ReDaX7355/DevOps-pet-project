namespace: todo-app

nodeSelector:
  role: app

postgres:
  db: todo_db
  user: postgres
  storage: 1Gi
  backupStorage: 2Gi

backend:
  image: ghcr.io/redax7355/backend
  tag: latest
  port: 5000
  replicas: 1

frontend:
  image: ghcr.io/redax7355/frontend
  tag: latest
  port: 80
  min_replicas: 1
  max_replicas: 3
