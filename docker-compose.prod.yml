version: "3.8"

services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRESS_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  app_backend:
    image: ghcr.io/redax7355/app_backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
    depends_on:
      - postgres-db
    networks:
      - app-network

  frontend:
    image: ghcr.io/redax7355/frontend:latest
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - app_backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
