apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}:{{ .Values.promtail.tag }}
          args:
            - "-config.file=/etc/promtail/promtail-config.yml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail-config.yml
              subPath: promtail-config.yml
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /var/log/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          hostPath:
            path: /var/log/promtail
            type: DirectoryOrCreate

