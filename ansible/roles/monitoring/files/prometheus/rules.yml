groups:
- name: node-alerts
  rules:

  - alert: HighCPU
    expr: 100 * (1 - avg by(instance)(
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU on {{ $labels.instance }}"

  - alert: DiskWillFill
    expr: predict_linear(
            node_filesystem_free_bytes{mountpoint="/"}[1h],
            86400
          ) < 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "The disk space will run out soon {{ $labels.instance }}"

  - alert: InstanceDown
    expr: up == 0
    for: 2m
    labels:
      severity: page
    annotations:
      summary: "Instance {{ $labels.instance }} is down"

  - alert: ContainerCrashLoop
    expr: increase(container_restart_count[10m]) > 3
    labels:
      severity: page
    annotations:
      summary: "The container is constantly restarting {{ $labels.instance }}"

  - alert: LowMemory
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Low memory on {{ $labels.instance }}"

  - alert: DiskSpaceLow
    expr: node_filesystem_alail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100 < 10
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Low disk space on {{ $labels.instance }}"

  - alert: TooManyCPUIOWait
    expr: 100* avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 20
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "High IO wait on {{ $labels.instance }}"

  - alert: Vector
    expr: vector(1)
    labels:
      severity: warning
    annotations:
      summary: "Vector {{ $labels.instance }}"
