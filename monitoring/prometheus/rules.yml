groups:
- name: node-alerts
  rules:

  - alert: HighCPU
    expr: 100 * (1 - avg by(instance)(
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU on {{ $labels.instance }}"
  - alert: DiskWillFill
    expr: predict_linear(
            node_filesystem_free_bytes{mountpoint="/"}[1h],
            86400
          ) < 0
    for: 10m
    labels:
      severity: critical
  - alert: InstanceDown
    expr: up == 0
    for: 2m
    labels:
      severity: page

  - alert: ContainerCrashLoop
    expr: increase(container_restart_count[10m]) > 3
